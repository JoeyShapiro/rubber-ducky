<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<link rel="icon" href="%sveltekit.assets%/favicon.png" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<link rel="manifest" href="%sveltekit.assets%/manifest.json" />
		<meta name="theme-color" content="#FAFAF8" />
		<link rel="apple-touch-icon" href="%sveltekit.assets%/icon-maskable-192.png" />
		%sveltekit.head%
	</head>

	<style>
		@font-face {
			font-family: "GG Sans";
			src: url("/gg-sans-2/gg\ sans\ Regular.ttf") format("truetype");
		}

		body { 
			font-family: "GG Sans", Verdana, Tahoma !important;
		}

		@font-face {
			font-family: "GG Mono";
			src: url("/gg-mono.woff2") format("woff2");
		}

		@font-face {
			font-family: "Futura Condensed";
			src: url("/Futura Condensed Medium.otf") format("opentype");
		}

		code {
			font-family: "GG Mono", monospace !important;
		}

		.spoil {
			filter: blur(5px);
		}
		.spoil:hover,
		.spoil:focus {
			filter: none;
			transition: filter 0.5s;
		}
	</style>

	<body data-sveltekit-preload-data="hover" style="height: 100%">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
